<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="keywords" content="games, 3kh0 lite, browser games" />
    <meta property="og:title" content="3kh0 lite | Game Site" />
    <meta property="og:site_name" content="3kh0 lite" />
    <meta property="og:description" content="Find a game, take a break, and enjoy 3kh0 lite." />
    <meta name="description" content="Find a game, take a break, and enjoy 3kh0 lite." />
    <meta name="author" content="3kh0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>3kh0 lite | Game Site</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #292929;
        color: #f3f4f6;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: radial-gradient(ellipse at top, #454545 0%, #292929 65%);
      }
      main { width: min(100%, 720px); }
      h1 { margin: 0; font-size: clamp(2.8rem, 9vw, 5rem); letter-spacing: -0.06em; }
      .subtitle { display: block; min-height: 1.8em; margin-top: 8px; color: #c4c7cc; font-size: 1.25rem; }
      .intro { margin: 22px auto 28px; color: #d1d5db; font-size: 1.1rem; line-height: 1.7; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      .button {
        display: inline-block;
        padding: 13px 24px;
        border: 1px solid #777;
        border-radius: 12px;
        background: #555;
        color: #fff;
        font-weight: 650;
        text-decoration: none;
        transition: background-color .15s ease, transform .15s ease;
      }
      .button:hover { background: #686868; transform: translateY(-2px); }
      .button.primary { background: #737373; border-color: #9a9a9a; }
      .button.primary:hover { background: #858585; }
      footer { max-width: 650px; margin-top: 48px; color: #aeb3ba; font-size: .9rem; line-height: 1.6; }
      footer a { color: #e0e0e0; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
    </style>
    <script src="/js/main.js"></script>
  </head>
  <body>
    <main>
      <h1>3kh0 lite</h1>
      <span id="subtitle" class="subtitle">A little break, one game at a time.</span>
      <p class="intro">Welcome to 3kh0 lite — a simple place to discover and play. Pick a game from the collection and jump right in.</p>
      <nav class="actions" aria-label="Main navigation">
        <a class="button primary" href="/projects.html">Browse all games</a>
        <a class="button" href="/misc.html">More options</a>
      </nav>
    </main>
    <footer>
      <p>&copy; 3kh0. This project is based on the <a href="https://github.com/3kh0/3kh0-lite">3kh0 lite repository</a>. Credit to the original creators and contributors.</p>
    </footer>
    <script src="/js/subtitle.js"></script>
  </body>
</html>
